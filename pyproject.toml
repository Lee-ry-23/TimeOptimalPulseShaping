[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-optimal-grape"
version = "0.1.0"
description = "Manual-block GRAPE optimization for phase-modulated Rydberg gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "jupyter>=1.0",
]

[project.optional-dependencies]
atom-physics = [
  "ARC-Alkali-Rydberg-Calculator>=3.10",
]
verification = [
  "qutip>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
